<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <!-- 계좌·연락처가 검색엔진에 노출되지 않도록 막습니다. 검색에 뜨게 하려면 이 줄을 지우세요. -->
    <meta name="robots" content="noindex, nofollow">
    <title>오원빈 ♥ 김경란 결혼합니다</title>

    <!-- ============================================================
         카카오톡 링크 미리보기 (OG 태그)

         ★ 여기는 config.js 가 아니라 이 파일에서 직접 고쳐야 합니다.
           카카오톡 스크래퍼는 자바스크립트를 실행하지 않아서,
           JS 로 넣은 태그는 미리보기에 절대 반영되지 않습니다.

         ★ og:url 과 og:image 는 반드시 https:// 로 시작하는 전체 주소여야 합니다.
           "assets/images/cover.jpg" 같은 상대경로는 카톡에서 이미지가 안 뜹니다.

         지금 값은 GitHub Pages 배포 주소입니다.
         배포 위치를 옮기면 og:url 과 og:image 두 줄을 함께 바꿔야 합니다.
         ============================================================ -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="오원빈 ♥ 김경란 결혼합니다">
    <meta property="og:description" content="2026년 11월 22일 일요일 오후 2시 · 헤리티크 제주 1층 글라스홀">
    <meta property="og:url" content="https://yoonbin.github.io/WB_Mobile_Invitation/">
    <meta property="og:image" content="https://yoonbin.github.io/WB_Mobile_Invitation/assets/images/share.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <!-- 휴대폰 브라우저 주소창 색. 배경이 흰색이라 함께 흰색으로 맞춘다. -->
    <meta name="theme-color" content="#FFFFFF">

    <!-- 글꼴은 이랜드 초이스 하나만 쓴다(style.css 의 @font-face).
         구글 폰트(Noto Sans KR / Gowun Batang / Italiana)는 더 이상 쓰지 않아 지웠다 — 약 490KB 절약. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
   
    <!-- ?v= 뒤 숫자는 캐시 번호입니다.
         내용을 고쳐 다시 올렸는데 하객 휴대폰에서 예전 내용이 그대로 보인다면,
         아래 세 곳(style.css / config.js / main.js)의 숫자를 1씩 올리세요. -->
    <link rel="stylesheet" href="assets/css/style.css?v=31">
</head>
<body>

<!-- 배경음악 토글 (config.bgm.file 이 있을 때만 표시) -->
<button id="bgmToggle" class="bgm-toggle" type="button" hidden aria-pressed="false" aria-label="배경음악 재생">
  <span class="bgm-toggle__bars" aria-hidden="true"><i></i><i></i><i></i></span>
</button>

<!-- 맨 위 / 맨 아래로 이동.
     <a href="#..."> 앵커라서 자바스크립트가 필요 없다.
     부드럽게 움직이는 건 style.css 의 html { scroll-behavior: smooth } 한 줄이 한다. -->
<nav class="jump" aria-label="빠른 이동">
  <a class="jump__btn" href="#cover" aria-label="맨 위로">
    <span aria-hidden="true"></span>
  </a>
  <a class="jump__btn" href="#end" aria-label="맨 아래로">
    <span aria-hidden="true"></span>
  </a>
</nav>

<main class="paper">

  <!-- ============ 표지 ============ -->
  <header class="cover" id="cover">
    <div class="arch">
      <!-- 표지 문구는 아치의 곡선을 그대로 따라 감싼다.
           아래 좌표계는 .arch 폭을 200 으로 본 값이다. 아치(사진틀)는 폭의 82% 이므로
           반지름 82, 중심 (100,100). 글자 기준선은 그보다 4 만큼 바깥인 반지름 86 위를 지난다.
           CSS 의 .arch { padding-top: 9% } 가 이 좌표계와 맞물려 있으니 함께 고칠 것. -->
      <svg class="arch__crown" viewBox="0 0 200 100" xmlns:xlink="http://www.w3.org/1999/xlink">
        <defs>
          <path id="archCurve" d="M 14 100 A 86 86 0 0 1 186 100"></path>
        </defs>
        <text>
          <!-- href 와 xlink:href 를 함께 둔다. 구형 모바일 사파리는 xlink 만 인식한다. -->
          <textPath href="#archCurve" xlink:href="#archCurve"
                    startOffset="50%" text-anchor="middle"
                    data-bind="greeting.eyebrow"></textPath>
        </text>
      </svg>

      <div class="arch__frame">
        <!-- src 를 여기 직접 적어두면 HTML 파싱 중에 내려받기가 시작돼 표지가 더 빨리 뜨고,
             자바스크립트가 막힌 환경에서도 사진이 보인다. 파일이 없으면 JS 가 자리표시로 교체한다. -->
        <img class="arch__img" id="coverImage" src="assets/images/cover.jpg" alt="신랑 오원빈, 신부 김경란">
      </div>
    </div>

    <h1 class="cover__names">
      <span class="cover__name" data-bind="groom.name"></span>
      <span class="cover__amp" aria-hidden="true">|</span>
      <span class="cover__name" data-bind="bride.name"></span>
    </h1>

    <!-- 날짜·장소를 위아래 선으로 감싼 한 덩어리로 둔다 -->
    <div class="cover__when">
      <p class="cover__date" id="coverDate"></p>
      <p class="cover__place">
        <span data-bind="wedding.venue"></span> <span data-bind="wedding.hall"></span>
      </p>
    </div>
  </header>

  <!-- ============ 인사말 ============ -->
  <section class="section" id="greeting" aria-labelledby="greetingTitle">
    <h2 class="section__title" id="greetingTitle" data-bind="greeting.title"></h2>
    <p class="prose" id="greetingBody"></p>

    <div class="rule" aria-hidden="true"></div>

    <div class="family" id="family"></div>

    <div class="contact-open">
      <button class="btn btn--ghost" type="button" data-open="contactSheet">연락하기</button>
    </div>
  </section>

  <!-- ============ 자기소개 ============ -->
  <!-- config.about.people 에 사진이나 소개글이 하나라도 있을 때만 JS 가 보여준다 -->
  <section class="section" id="about" aria-labelledby="aboutTitle" hidden>
    <h2 class="section__title" id="aboutTitle">저희를 소개합니다</h2>
    <div class="about" id="aboutList"></div>
  </section>

  <!-- ============ 예식 안내 · 달력 ============ -->
  <section class="section section--tint" id="calendar" aria-labelledby="calendarTitle">
    <h2 class="section__title" id="calendarTitle">예식 안내</h2>

    <!-- 달력 위 사진 (config.calendar.image 가 있을 때만 JS 가 채운다) -->
    <div class="cal-photo" id="calPhoto" hidden></div>

    <p class="dateline" id="dateLine"></p>

    <!-- 달력은 위의 날짜 문장을 눈으로 확인시켜 주는 보조 그림이다.
         스크린리더에는 라벨 없는 숫자 30개로 읽히므로 읽기 대상에서 뺀다.
         같은 정보를 #dateLine 과 #dday 가 문장으로 전달한다. -->
    <p class="cal__month" id="calMonth" aria-hidden="true"></p>
    <div class="cal" id="calWrap" aria-hidden="true">
      <div class="cal__head" id="calHead"></div>
      <div class="cal__grid" id="calGrid"></div>
    </div>

    <!-- D-day 플립 시계.
         숫자판은 JS 가 만든다. aria-hidden 인 이유는 매초 바뀌는 숫자를
         스크린리더가 계속 읽으면 방해가 되기 때문이고,
         같은 내용을 아래 #ddayText 가 한 문장으로 대신 전달한다. -->
    <div class="flip" id="flip" aria-hidden="true"></div>
    <p class="dday" id="dday"></p>
  </section>

  <!-- ============ 갤러리 ============ -->
  <section class="section" id="gallery" aria-labelledby="galleryTitle">
    <h2 class="section__title" id="galleryTitle">갤러리</h2>
    <div class="grid" id="galleryGrid"></div>
    <button class="btn btn--ghost gallery__more" type="button" id="galleryMore" hidden></button>
    <p class="hint">사진을 누르면 크게 볼 수 있어요</p>
  </section>

  <!-- ============ 오시는 길 ============ -->
  <section class="section section--tint" id="location" aria-labelledby="locationTitle">
    <h2 class="section__title" id="locationTitle">오시는 길</h2>

    <p class="place-name">
      <span data-bind="wedding.venue"></span><br>
      <em data-bind="wedding.hall"></em>
    </p>

    <!-- 네이버 지도. config 의 lat·lng·naverMapClientId 가 모두 있어야 뜬다.
         하나라도 비면 아래 안내 문구가 무엇이 빠졌는지 알려준다.
         길찾기 버튼들은 키 없이 언제나 동작한다. -->
    <div class="map" id="mapBox">
      <div class="map__placeholder" id="mapPlaceholder">지도를 준비하는 중입니다</div>
    </div>

    <p class="address">
      <span id="addressText"></span>
      <button class="chip" type="button" id="copyAddress">주소 복사</button>
    </p>

    <div class="nav-apps">
      <a class="nav-app" id="navTmap" href="#" target="_blank" rel="noopener">티맵</a>
      <a class="nav-app" id="navKakao" href="#" target="_blank" rel="noopener">카카오내비</a>
      <a class="nav-app" id="navNaver" href="#" target="_blank" rel="noopener">네이버지도</a>
    </div>

    <dl class="transport" id="transport"></dl>
    <p class="venue-tel" id="venueTel" hidden></p>
  </section>

  <!-- ============ 마음 전하실 곳 ============ -->
  <section class="section section--tint" id="account" aria-labelledby="accountTitle" hidden>
    <h2 class="section__title" id="accountTitle">마음 전하실 곳</h2>
    <p class="prose prose--sm" id="accountMessage"></p>
    <div class="accordions" id="accountList"></div>
  </section>

  <!-- ============ 방명록 ============ -->
  <section class="section section--tint" id="guestbook" aria-labelledby="guestbookTitle" hidden>
    <h2 class="section__title" id="guestbookTitle">방명록</h2>
    <p class="prose prose--sm">축하의 한마디를 남겨주세요.</p>

    <ul class="gb-list" id="gbList"></ul>
    <div class="gb-actions">
      <button class="btn btn--ghost" type="button" id="gbMore" hidden>더 보기</button>
      <button class="btn" type="button" data-open="gbSheet">방명록 남기기</button>
    </div>
  </section>

  <!-- ============ 마무리 ============ -->
  <!-- id="end" 는 '맨 아래로' 버튼의 도착지다. -->
  <footer class="closing" id="end">
    <div class="rule rule--wide" aria-hidden="true"></div>
    <p class="closing__line">함께해 주시는 모든 분께 감사드립니다</p>
    <p class="closing__names">
      <span data-bind="groom.name"></span> · <span data-bind="bride.name"></span>
    </p>
    <button class="btn btn--ghost" type="button" id="shareBtn">청첩장 공유하기</button>

    <p class="credit">
        <span class="credit__copy">Copyright 2026. ohwonbin All Rights Reserved.</span>
      <span class="credit__bgm">
        배경음악
        <a href="https://blog.naver.com/hae_mosu/224214506343" target="_blank" rel="noopener">해모수 블로그</a>
      </span>
    </p>
  </footer>

</main>

<!-- ============ 라이트박스 ============ -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
  <button class="lightbox__close" type="button" data-close aria-label="닫기">✕</button>
  <button class="lightbox__nav lightbox__nav--prev" type="button" id="lbPrev" aria-label="이전 사진">‹</button>
  <img class="lightbox__img" id="lbImg" alt="">
  <button class="lightbox__nav lightbox__nav--next" type="button" id="lbNext" aria-label="다음 사진">›</button>
  <p class="lightbox__count" id="lbCount"></p>
</div>

<!-- ============ 연락처 시트 ============ -->
<div class="sheet" id="contactSheet" role="dialog" aria-modal="true" aria-labelledby="contactSheetTitle" hidden>
  <div class="sheet__panel">
    <h3 class="sheet__title" id="contactSheetTitle">연락하기</h3>
    <div class="sheet__body" id="contactList"></div>
    <button class="btn btn--ghost sheet__close" type="button" data-close>닫기</button>
  </div>
</div>

<!-- ============ 방명록 작성 시트 ============ -->
<div class="sheet" id="gbSheet" role="dialog" aria-modal="true" aria-labelledby="gbSheetTitle" hidden>
  <div class="sheet__panel">
    <h3 class="sheet__title" id="gbSheetTitle">방명록 남기기</h3>
    <form class="form" id="gbForm">
      <label class="form__row">
        <span class="form__label">이름</span>
        <input class="input" type="text" name="name" maxlength="20" required autocomplete="name">
      </label>
      <label class="form__row">
        <span class="form__label">축하 메시지</span>
        <textarea class="input" name="message" rows="4" maxlength="300" required></textarea>
      </label>
      <p class="form__note">남기신 글은 이 기기에서만 삭제할 수 있습니다.</p>
      <p class="form__error" id="gbError" role="alert" hidden></p>
      <div class="form__actions">
        <button class="btn btn--ghost" type="button" data-close>닫기</button>
        <button class="btn" type="submit">남기기</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ 토스트 ============ -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/config.js?v=31"></script>
<script src="assets/js/main.js?v=32"></script>
</body>
</html>
